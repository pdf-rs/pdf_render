[package]
name = "pdf_render"
version = "0.2.0"
authors = ["Sebastian Köln <s3bk@protonmail.com>"]
edition = "2021"

[features]
default = ["native"]
unstable = []
# Everything that assumes an operating system: `$STANDARD_FONTS` from the
# environment, dumping fonts to disk, the system font database, and the GPU
# backends. A wasm build turns this off and hands the fonts in as a bundle
# (`font::MemDir`), because a browser has no environment and no filesystem.
native = []
# SVG output: one document per vector layer, raw RGBA for images.
svg = []
# Embed the standard fonts into the binary instead of reading them from
# $STANDARD_FONTS at run time.
embed = ["dep:rust-embed"]
# Write a font bundle (see `MemDir::write_bundle`). Build tooling only: reading
# a bundle needs no feature, writing one needs the encoder.
# Writing a font bundle needs an encoder. Reading one needs nothing: the bundle
# is built brotli-compressed and the server sends it with `Content-Encoding: br`,
# so the network layer hands wasm the plain bundle — see `Codec`.
bundle-write = ["dep:brotli", "dep:brotli-decompressor"]
# Load the system font database for glyph fallback.
glyphmatcher = ["dep:glyphmatcher", "native"]
# Legacy GPU backend built on pathfinder_renderer. Off by default: the vello
# backends below replace it, and it pulls in the whole pathfinder renderer
# stack.
pathfinder = ["dep:pathfinder_renderer", "native"]
# GPU rendering through vello (wgpu).
vello = ["dep:vello", "native"]
# Software rendering without a GPU, via the vello_cpu crate.
vello_cpu = ["dep:vello_cpu"]

[[bench]]
name = "render"
harness = false

# CPU rendering examples need the optional vello_cpu dependency.
[[example]]
name = "render_cpu"
required-features = ["vello_cpu"]

[[example]]
name = "cpu_smoke"
required-features = ["vello_cpu"]

[[example]]
name = "vello_scene"
required-features = ["vello"]

# Builds the font bundle the browser fetches (build time only).
[[bin]]
name = "fonts_blob"
required-features = ["bundle-write"]

# Where the bytes are, for deciding what a smaller bundle can afford to drop
# (build time only, all three).
[[bin]]
name = "fonts_probe"
required-features = ["bundle-write"]

[[bin]]
name = "fonts_cover"
required-features = ["bundle-write"]

[[bin]]
name = "fonts_parts"
required-features = ["bundle-write"]

[dependencies.pdf]
default-features = false
features = ["cache", "dump"]
git = "https://github.com/pdf-rs/pdf"

[dependencies]
log = "0.4"
font = { git = "https://github.com/pdf-rs/font", branch = "vello", features = ["cff"] }
pdf_encoding = "0.4"
itertools = "*"
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
instant = "*"
custom_debug_derive = "*"
globalcache = { version = "0.3", features = ["sync"] }
istring = { git = "https://github.com/s3bk/istring" }
once_cell = "*"
serde_json = "*"
# Decoding a font bundle: flate2, which is already in the tree of a pdf build
# (its stream filters). Brotli decoding is build-tooling only — a browser is
# handed the plain bundle by `Content-Encoding: br` and never needs a decoder in
# the module, which would cost 177 kB (135 kB of it brotli's dictionary).
flate2 = "*"
brotli = { version = "8", optional = true }
brotli-decompressor = { version = "5", optional = true }
glyphmatcher = { git = "https://github.com/s3bk/glyphmatcher", optional = true }
rust-embed = { version = "*", optional = true, features = ["interpolate-folder-path"] }

# Geometry and path types are part of the public backend API (and the font crate
# expresses glyph outlines in them), so they stay unconditional for now.
pathfinder_color = { git = "https://github.com/servo/pathfinder" }
pathfinder_geometry = { git = "https://github.com/servo/pathfinder" }
pathfinder_content = { git = "https://github.com/servo/pathfinder" }
pathfinder_renderer = { git = "https://github.com/servo/pathfinder", optional = true }

peniko = "0.6"
vello = { version = "=0.11.0", optional = true }
vello_encoding = "=0.11.0"
vello_cpu = { version = "0.3", optional = true, default-features = false, features = ["std", "png", "u8_pipeline", "f32_pipeline"] }

[dev-dependencies]
criterion = "0.3"
env_logger = "*"
rand = "0.6"
