# Default this directory's cargo invocations to the browser target: everything
# under `web/` is the wasm half of the viewer. Native `cargo test -p pdf_web`
# from the workspace root is unaffected — cargo reads config from the directory
# it is invoked in, and the root has none.
[build]
target = "wasm32-unknown-unknown"

# The module is fetched over the network before a page appears, so bytes matter
# more than the last few percent of speed.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Two crates in the tree want JavaScript on wasm32-unknown-unknown, and the
# module must import nothing: `WebAssembly.Module.imports` on this file is the
# whole audit surface, and it has to come back empty.
#
# - web-time: `std::time::Instant` panics on wasm32-unknown-unknown, so the
#   real crate reads the browser clock through wasm-bindgen. `vendor/web-time`
#   is a logical clock instead (one millisecond per timestamp).
# - font (pdf-rs/font, branch vello): its Type 2 `random` operator used
#   `rand::thread_rng`, which on wasm pulls `getrandom`, which asks
#   `crypto.getRandomValues`. The patch replaces it with a fixed-seed generator
#   in `src/type2.rs`, which also makes rendering reproducible.
#
# The font override is a branch of the fork, not an upstream branch: the change
# is proposed on s3bk/font `vello` and nothing here points outside the tree.
[patch.crates-io]
web-time = { path = "../vendor/web-time" }

[patch."https://github.com/pdf-rs/font"]
font = { git = "https://github.com/s3bk/font", branch = "vello" }
