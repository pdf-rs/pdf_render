<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PDF</title>
<style>
/* ------------------------------------------------------------------ tokens
   Light is the base; `data-theme` is set to the *resolved* theme by the
   script (`auto` is resolved there too), so nothing below has to repeat a
   media query. */
:root {
    --bg: #f3f4f7;
    --bg-glow: radial-gradient(90% 60% at 50% 0%, #ffffff 0%, #f3f4f7 55%, #eceef2 100%);
    --ink: #17191d;
    --muted: #6a7180;
    --faint: #8b92a0;
    --bar: rgba(255, 255, 255, .78);
    --hover: rgba(17, 24, 39, .065);
    --press: rgba(17, 24, 39, .11);
    --line: rgba(17, 24, 39, .09);
    --field: rgba(255, 255, 255, .8);
    --ring: #3b6ef6;
    --accent: #2f62e0;
    --danger: #b42318;
    --danger-bg: rgba(180, 35, 24, .09);
    --dot: rgba(17, 24, 39, .22);
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 10px 15px -3px rgba(16, 24, 40, .07),
              0 30px 60px -12px rgba(16, 24, 40, .16), 0 0 0 1px rgba(16, 24, 40, .07);
    --dock-shadow: 0 12px 28px -10px rgba(16, 24, 40, .28), 0 2px 6px rgba(16, 24, 40, .08),
                   0 0 0 1px rgba(16, 24, 40, .07);
    color-scheme: light;
}
:root[data-theme="dark"] {
    --bg: #0f1115;
    --bg-glow: radial-gradient(90% 60% at 50% 0%, #1a1d24 0%, #0f1115 55%, #0b0d10 100%);
    --ink: #e8eaee;
    --muted: #9aa1ae;
    --faint: #7c8492;
    --bar: rgba(22, 25, 31, .74);
    --hover: rgba(255, 255, 255, .08);
    --press: rgba(255, 255, 255, .14);
    --line: rgba(255, 255, 255, .1);
    --field: rgba(255, 255, 255, .06);
    --ring: #7ea0ff;
    --accent: #8fb0ff;
    --danger: #ff8f85;
    --danger-bg: rgba(255, 90, 78, .12);
    --dot: rgba(255, 255, 255, .3);
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 15px -3px rgba(0, 0, 0, .5),
              0 30px 60px -12px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .08);
    --dock-shadow: 0 12px 28px -10px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .4),
                   0 0 0 1px rgba(255, 255, 255, .09);
    color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0; height: 100dvh; display: flex; flex-direction: row; overflow: hidden;
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg); color: var(--ink);
}
button, input { font: inherit; color: inherit; }
::selection { background: color-mix(in srgb, var(--ring) 28%, transparent); }

/* ------------------------------------------------------------ the sidebar
   The table of contents, in a column of its own. The page is a column too, so
   the two are a row: open, the sidebar takes its width from the stage and the
   pages refit; closed, the stage has all of it. On a phone it is an overlay,
   because 260px of a 380px screen is not a sidebar, it is the screen. */
#main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#side {
    flex: 0 0 auto; width: 268px; display: flex; flex-direction: column; min-height: 0;
    background: var(--bar); border-right: 1px solid var(--line);
}
#side[hidden] { display: none; }
.side-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: .25rem;
    height: 52px; padding: 0 .375rem 0 .9375rem; border-bottom: 1px solid var(--line);
    font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted);
}
.side-head span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#toc { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: .375rem .375rem 1.25rem; }
.toc-note { padding: .7rem .625rem; color: var(--faint); font-size: 12.5px; line-height: 1.45; }
.toc-row {
    display: flex; align-items: baseline; gap: .5rem; width: 100%;
    padding: .28rem .5rem; border: 0; border-radius: 7px; background: transparent;
    color: inherit; cursor: pointer; font-size: 12.5px; line-height: 1.4; text-align: left;
    transition: background .12s, color .12s;
}
.toc-row:hover { background: var(--hover); }
.toc-row[aria-current="true"] {
    background: color-mix(in srgb, var(--ring) 15%, transparent); color: var(--accent); font-weight: 550;
}
.toc-row:disabled { cursor: default; color: var(--faint); }
.toc-row:disabled:hover { background: transparent; }
.toc-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toc-page { flex: 0 0 auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.toc-row[aria-current="true"] .toc-page { color: inherit; }

/* --------------------------------------------------------------- the bar */
header {
    flex: 0 0 auto; display: flex; align-items: center; gap: .625rem;
    height: 52px; padding: 0 .75rem 0 .875rem;
    background: var(--bar); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6);
    position: relative; z-index: 3;
}
.mark {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
    background: linear-gradient(160deg, #4b7bff, #2f4fd0); color: #fff;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .2), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.mark svg { width: 15px; height: 15px; }
.titles { min-width: 0; display: flex; align-items: baseline; gap: .5rem; }
#title {
    font-weight: 600; letter-spacing: -.01em; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 34vw;
}
#readout {
    font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw;
}
.grow { flex: 1 1 auto; min-width: 0; }

#openform { display: flex; align-items: center; gap: .375rem; flex: 0 1 auto; min-width: 0; }
/* `display: flex` beats the UA rule for `hidden`; say it again. */
#openform[hidden], #openbtn[hidden] { display: none; }
#url {
    width: min(34vw, 320px); min-width: 6rem; height: 32px; padding: 0 .7rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--field);
    font-size: 13px; outline: none;
    transition: border-color .12s, box-shadow .12s, background .12s;
}
#url::placeholder { color: var(--faint); }
#url:focus { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }

.btn {
    height: 32px; padding: 0 .8rem; border: 1px solid var(--line); border-radius: 8px;
    background: var(--field); cursor: pointer; font-size: 13px; font-weight: 500;
    transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--hover); }
.btn:active { background: var(--press); }
.icon-btn {
    flex: 0 0 auto; width: 32px; height: 32px; display: grid; place-items: center;
    border: 0; border-radius: 8px; background: transparent; cursor: pointer; color: var(--muted);
    transition: background .12s, color .12s;
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:active { background: var(--press); }
.icon-btn svg { width: 17px; height: 17px; }
:where(button, input, .card):focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

/* A hairline that runs while something is being read: no claim about how
   long it will take, just that the page is on its way. */
#progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden;
            opacity: 0; transition: opacity .2s; }
body.busy #progress { opacity: 1; }
#progress::before {
    content: ""; position: absolute; inset: 0; width: 40%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: slide 1.1s ease-in-out infinite;
}
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }

/* -------------------------------------------------------------- the stage */
#stage { flex: 1 1 auto; overflow: auto; background: var(--bg-glow); position: relative; }
.sheet {
    display: flex; align-items: flex-start; min-width: 100%; min-height: 100%;
    padding: 28px 28px 104px;
}
/* The pages are one column, laid out by the script: every page has its slot
   from the start, rendered or not, so the scrollbar tells the truth and a page
   arriving never moves the one above it. Reading is scrolling. */
#pages { position: relative; flex: 0 0 auto; margin: 0 auto; }
#pages:empty { display: none; }
.page {
    position: absolute; left: 0; right: 0; margin: 0 auto;
    background: #fff; border-radius: 3px; overflow: hidden; line-height: 0;
    box-shadow: var(--shadow);
}
/* The width/height the script sets is the whole size; the page may not be
   shrunk or stretched by the sheet. */
.page svg { display: block; width: 100%; height: 100%; max-width: none; max-height: none; }
.page.enter { animation: pagein .19s ease-out both; }
@keyframes pagein { from { opacity: 0; transform: translateY(7px) } to { opacity: 1; transform: none } }

/* ----------------------------------------------------------- no document */
#welcome { position: absolute; inset: 0; display: grid; place-items: center; padding: 1.25rem; }
#welcome[hidden] { display: none; }
.card {
    width: min(430px, 100%); padding: 2rem 1.75rem; text-align: center; cursor: pointer;
    border-radius: 16px; border: 1px dashed color-mix(in srgb, var(--dot) 60%, transparent);
    background: color-mix(in srgb, var(--bg) 40%, transparent);
    transition: border-color .16s, background .16s, transform .16s;
}
.card:hover { border-color: var(--ring); background: color-mix(in srgb, var(--ring) 6%, transparent); }
.card.hot { border-color: var(--ring); background: color-mix(in srgb, var(--ring) 10%, transparent); transform: scale(1.01); }
.card .glyph {
    width: 48px; height: 48px; margin: 0 auto 1rem; border-radius: 12px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--ring) 12%, transparent); color: var(--accent);
}
.card .glyph svg { width: 24px; height: 24px; }
.card h1 { margin: 0 0 .35rem; font-size: 1.0625rem; font-weight: 600; letter-spacing: -.01em; }
.card p { margin: 0; color: var(--muted); font-size: 13px; }
.card .hint { margin-top: .9rem; font-size: 12px; color: var(--faint); }
.card code { font: 11.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
             padding: .2em .4em; border-radius: 5px; background: var(--hover); }

/* ------------------------------------------------------------- the dock */
#dock {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(6px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 2px; padding: 5px;
    border-radius: 999px; background: var(--bar); box-shadow: var(--dock-shadow);
    backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6);
    z-index: 4; transition: opacity .18s, transform .18s;
}
body.ready #dock { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
#dock button {
    width: 34px; height: 34px; border: 0; border-radius: 999px; background: transparent;
    display: grid; place-items: center; cursor: pointer; color: var(--ink);
    transition: background .12s, opacity .12s;
}
#dock button:hover:not(:disabled) { background: var(--hover); }
#dock button:active:not(:disabled) { background: var(--press); }
#dock button:disabled { opacity: .3; cursor: default; }
#dock svg { width: 17px; height: 17px; }
#pageno {
    width: 2.6em; height: 34px; padding: 0; border: 0; background: transparent; text-align: center;
    font-variant-numeric: tabular-nums; font-weight: 550; border-radius: 8px; outline: none;
    -moz-appearance: textfield; appearance: textfield;
}
#pageno::-webkit-outer-spin-button, #pageno::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
#pageno:hover { background: var(--hover); }
#pageno:focus { background: var(--field); box-shadow: inset 0 0 0 1px var(--ring); }
.of { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-right: .35rem; }
.sep { width: 1px; height: 20px; margin: 0 .3rem; background: var(--line); }
#zoomlabel {
    width: auto; min-width: 52px; padding: 0 .5rem; font-size: 12.5px; font-variant-numeric: tabular-nums;
    color: var(--muted); font-weight: 500;
}
#zoomlabel:hover { color: var(--ink); }

/* -------------------------------------------------------------- an error */
#error {
    position: fixed; left: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    max-width: min(520px, calc(100vw - 36px)); z-index: 5; display: none;
    padding: .7rem .9rem .7rem 1rem; border-radius: 12px;
    background: var(--danger-bg); color: var(--danger); font-size: 12.5px; line-height: 1.45;
    white-space: pre-wrap; overflow-wrap: anywhere;
    border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .35);
}
#error.show { display: flex; gap: .75rem; align-items: flex-start; }
#error #errortext { flex: 1 1 auto; min-width: 0; }
#error button {
    flex: 0 0 auto; border: 0; background: transparent; color: inherit; cursor: pointer;
    opacity: .7; padding: 0; line-height: 1; font-size: 16px;
}
#error button:hover { opacity: 1; }

@media (max-width: 720px) {
    #readout { display: none; }
    #title { max-width: 40vw; }
    #url { width: 8rem; }
    .sheet { padding: 16px 16px 96px; }
    /* An overlay, not a column: the page keeps the whole screen. */
    #side {
        position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 84vw); z-index: 7;
        box-shadow: var(--shadow); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
}
@media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>
<aside id="side" aria-label="contents">
    <div class="side-head">
        <span>Contents</span>
        <button class="icon-btn" id="sideclose" title="hide contents (t)" aria-label="hide contents">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
    </div>
    <nav id="toc" aria-label="table of contents"></nav>
</aside>
<div id="main">
<header>
    <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 3v5h5"/><path d="M19 8.5V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h8z"/>
        </svg>
    </div>
    <div class="titles">
        <span id="title">PDF</span>
        <span id="readout"></span>
    </div>
    <span class="grow"></span>
    <button class="icon-btn" id="openbtn" title="open another PDF" aria-label="open another PDF" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/>
            <path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>
        </svg>
    </button>
    <form id="openform" autocomplete="off">
        <input id="url" type="url" placeholder="https://…/file.pdf" spellcheck="false" aria-label="PDF address">
        <button class="btn" id="go" type="submit">Open</button>
    </form>
    <button class="icon-btn" id="tocbtn" title="contents (t)" aria-label="table of contents" aria-expanded="true" aria-controls="side">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>
        </svg>
    </button>
    <button class="icon-btn" id="theme" title="theme: auto" aria-label="change theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
    </button>
    <div id="progress"></div>
</header>

<div id="stage">
    <div class="sheet"><div id="pages"></div></div>
    <div id="welcome">
        <div class="card" id="card" role="button" tabindex="0">
            <div class="glyph">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 3v5h5"/><path d="M19 8.5V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h8z"/>
                    <path d="M9 15h6M9 11.5h3"/>
                </svg>
            </div>
            <h1>Drop a PDF here</h1>
            <p>or <span style="color:var(--accent);font-weight:550">choose a file</span> from this device</p>
            <div class="hint">…or put one in the address bar: <code>?pdf=…</code></div>
            <input id="file" type="file" accept="application/pdf,.pdf" hidden>
        </div>
    </div>
</div>
</div>

<div id="dock">
    <button id="prev" title="previous page (←)" aria-label="previous page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <input id="pageno" type="number" min="1" step="1" value="1" title="page number (type one, Enter)" aria-label="page number">
    <span class="of">/ <span id="pagecount">–</span></span>
    <button id="next" title="next page (→)" aria-label="next page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <span class="sep"></span>
    <button id="zoomout" title="zoom out (−)" aria-label="zoom out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
    <button id="zoomlabel" title="fit page / fit width / actual size">100%</button>
    <button id="zoomin" title="zoom in (+)" aria-label="zoom in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
</div>

<div id="error" role="alert"><span id="errortext"></span><button id="errorclose" aria-label="dismiss">×</button></div>

<script type="module">
import { load, Doc, HttpSource, parseTable } from './doc.js';
import { Sealed, keyFromFragment } from './seal.js';
import { resolve as assetUrl } from './assets.js';

// Where the wasm module and the font bundle live, relative to this page, or —
// in a share — wherever `assets.json` says: those two files are the same in
// every bundle, so the share service keeps them once, under a name that carries
// their hash. The font bundle arrives brotli-compressed (`Content-Encoding:
// br`, what a server does for a `.br` file): `fetch` hands the module the plain
// bundle, so nothing here has to decompress anything.
const WASM = await assetUrl('pdf_web.wasm');
// `?fonts=` puts another standard-font bundle in place of the shipped one: two
// packs can be compared page for page without publishing two viewers.
const FONTS = new URLSearchParams(location.search).get('fonts') || await assetUrl('standard_fonts.br');

const $ = (id) => document.getElementById(id);
const stage = $("stage"), pages = $("pages");
const state = {
    doc: null, page: 0, pages: 0, url: "", length: 0,
    zoom: "page",       // "page" | "width" | a number
    size: null,         // a page's natural size in CSS px, from its SVG
    sizes: new Map(),   // page index -> natural size, where a page differs
    layout: null,       // the column: every page's top, width and height
    mounted: new Map(), // page index -> the element holding it
    mounting: new Map(),// page index -> the render still running for it
    z: 1,               // what `zoom` worked out to, for the +/- buttons
    busy: false,
};

function say(text) { $("readout").textContent = text; }
function fail(e) {
    const text = String(e && (e.stack || e.message) || e);
    $("errortext").textContent = text;
    $("error").classList.add("show");
    console.error(e);
}
function clearError() { $("error").classList.remove("show"); $("errortext").textContent = ""; }
// Nested (open() renders its first page): only the outermost call counts.
let busyDepth = 0;
function busy(on) {
    busyDepth = Math.max(0, busyDepth + (on ? 1 : -1));
    state.busy = busyDepth > 0;
    document.body.classList.toggle("busy", state.busy);
}

await load(WASM).catch(fail);

/** Bytes of a PDF at `url`, without reading it: HEAD, else a one-byte range. */
async function fileLength(url) {
    const head = await fetch(url, { method: "HEAD" });
    const len = head.headers.get("content-length");
    if (head.ok && len) return Number(len);
    const probe = await fetch(url, { headers: { Range: "bytes=0-0" } });
    const range = probe.headers.get("content-range");   // "bytes 0-0/123456"
    const total = range && range.split("/").pop();
    if (!total || total === "*") throw new Error(`${url}: the server does not say how large it is`);
    return Number(total);
}

/** The sender's per-page table, if it shipped one: `<pdf>.tbl` next to the
 *  file. It says what each page reads, so one request per page is enough. No
 *  table is not an error — the client then discovers the ranges page by page. */
async function loadTable(url) {
    try {
        const response = await fetch(`${url}.tbl`);
        if (!response.ok) return null;
        const table = parseTable(await response.text());
        console.log(`table: ${table.size} page(s)`);
        return table;
    } catch (e) {
        console.log(`no range table: ${e.message || e}`);
        return null;
    }
}

function nameOf(url) {
    try {
        const last = new URL(url, location.href).pathname.split("/").pop() || url;
        return decodeURIComponent(last.replace(/\.sealed$/, ""));
    } catch { return url; }
}

async function open(url, startAt = 1) {
    clearError();
    if (state.doc) state.doc.free();
    state.doc = null;
    state.url = url;
    state.pages = 0;
    resetPages();
    $("title").textContent = nameOf(url);
    document.title = `${nameOf(url)} — PDF`;
    busy(true);
    try {
        say("opening …");
        // A sealed share carries its key in the fragment: the bytes on the
        // server are ciphertext, and the page is the only place that can read
        // them. Without a key this is an ordinary range-read file.
        const key = keyFromFragment(location.hash);
        let source;
        try {
            source = key ? await Sealed.open(url, key) : new HttpSource(url, await fileLength(url));
        } catch (e) {
            if (key) throw e;
            // No key, and the plain file is not there: say what is actually
            // wrong rather than "Failed to fetch".
            const sealed = await fetch(`${url}.sealed`, { headers: { Range: "bytes=0-0" } }).catch(() => null);
            if (sealed && sealed.ok) {
                throw new Error(
                    `${url} is sealed: this link is missing its key. Open the whole link, including ` +
                    `the part after # (it looks like #k=…); without it the file is ciphertext and ` +
                    `nothing here can read it.`);
            }
            throw e;
        }
        const length = source.length;
        state.length = length;
        const doc = new Doc(source);
        const fontBytes = await doc.fonts(FONTS);
        const table = await loadTable(url);
        if (table) doc.setTable(table);
        state.pages = await doc.open();
        state.doc = doc;
        state.page = 0;
        $("pagecount").textContent = String(state.pages);
        $("pageno").max = String(state.pages);
        $("welcome").hidden = true;
        document.body.classList.add("ready");
        // A zoom needs a page size and only a rendered page has one: lay the
        // column out from the likely size, corrected when the page arrives.
        fit();
        $("openform").hidden = true;
        $("openbtn").hidden = false;
        say(`${state.pages} page(s), ${fmt(length)}`);
        console.log(`fonts: ${fmt(fontBytes)}; table: ${table ? `${table.size} page(s)` : "none"}; open: ${doc.requests} request(s), ${fmt(doc.bytes)}`);
        // Straight to the page asked for: the point of the range table is that
        // landing on page 20 costs page 20, not pages 1–20.
        await show(Math.min(Math.max(1, startAt), state.pages) - 1);
        refreshToc();
    } catch (e) { fail(e); } finally { busy(false); }
}

function fmt(n) {
    return n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} KiB` : `${(n / 1048576).toFixed(1)} MiB`;
}

/** The next and previous page, fetched while the reader is still on this one.
 *  With a table that is the whole cost of a page turn: the bytes are here
 *  before the click, so the turn is one render and nothing else. `?preload=0`
 *  turns it off, for a link where every byte of traffic counts — it is real
 *  traffic, twice the bytes of a page you never visit. */
const PRELOAD = new URLSearchParams(location.search).get("preload") !== "0";
function preloadNeighbours() {
    const doc = state.doc;
    if (!doc || !PRELOAD) return;
    const before = doc.preload.bytes;
    const jobs = [state.page + 1, state.page - 1, state.page + 2].map((i) => doc.prefetch(i).catch(() => 0));
    Promise.all(jobs).then((got) => {
        const bytes = doc.preload.bytes - before;
        if (bytes > 0) console.log(`preloaded neighbours: ${fmt(bytes)} in ${got.filter(Boolean).length} page(s)`);
    });
}

async function show(i) {
    const doc = state.doc;
    if (!doc || i < 0 || i >= state.pages) return;
    state.page = Math.round(i);
    updateChrome();
    mountAround();
    scrollToPage(state.page);
    busy(true);
    try { await mount(state.page); } catch (e) { fail(e); } finally { busy(false); }
    preloadNeighbours();
}

// --- the pages -----------------------------------------------------------
//
// A document is a column of pages, not one page that is swapped out: page `k`
// sits at an offset that depends only on the sizes of the pages above it, so
// the scrollbar is honest and a page that arrives late cannot shove its
// neighbours around. Only the pages near the reader are in the DOM; the rest
// are their slots' worth of space, waiting. Reading is scrolling.

const PROVISIONAL = [612, 792];   // letter, until a page says otherwise
const GAP = 18;                   // px between two pages, whatever the zoom
const KEEP = 2;                   // pages either side of the reader kept rendered

/** Natural size of page `k`, in CSS px. */
function naturalSize(k) {
    return state.sizes.get(k) || state.size || PROVISIONAL;
}

/** Lay the column out at the current zoom: every slot's top, width and height,
 *  the height of the whole column, and the pages already in the DOM moved to
 *  where they now belong. */
function relayout() {
    const n = state.pages;
    if (!n) return null;
    const tops = new Float64Array(n), hs = new Float64Array(n), ws = new Float64Array(n);
    let top = 0, maxW = 0;
    for (let i = 0; i < n; i++) {
        const [w, h] = naturalSize(i);
        tops[i] = top; ws[i] = w * state.z; hs[i] = h * state.z;
        top += hs[i] + GAP;
        if (ws[i] > maxW) maxW = ws[i];
    }
    state.layout = { tops, hs, ws, maxW, total: Math.max(0, top - GAP) };
    pages.style.height = `${state.layout.total}px`;
    pages.style.width = `${maxW}px`;
    for (const [k, el] of state.mounted) place(k, el);
    return state.layout;
}

function place(k, el) {
    const L = state.layout;
    if (!L || k >= L.tops.length) return;
    el.style.top = `${L.tops[k]}px`;
    el.style.width = `${L.ws[k]}px`;
    el.style.height = `${L.hs[k]}px`;
}

/** How far into the page the reader is, 0..1: what a zoom has to keep. */
function progressInPage() {
    const L = state.layout;
    if (!L) return 0;
    const d = stage.scrollTop - pages.offsetTop - L.tops[state.page];
    return L.hs[state.page] > 0 ? Math.min(Math.max(d / L.hs[state.page], 0), 1) : 0;
}

function restoreProgress(p) {
    const L = state.layout;
    if (!L) return;
    stage.scrollTop = Math.max(0, pages.offsetTop + L.tops[state.page] + p * L.hs[state.page]);
}

/** Put a page's top at the top of the viewport. */
function scrollToPage(k) {
    const L = state.layout;
    if (!L || k >= L.tops.length) return;
    stage.scrollTop = Math.max(0, pages.offsetTop + L.tops[k]);
}

/** The page under the middle of the viewport — the one the reader is on, so
 *  the number changes when the next page is more than half in view. */
function pageAtScroll() {
    const L = state.layout;
    if (!L) return 0;
    const y = stage.scrollTop + stage.clientHeight * 0.5 - pages.offsetTop;
    let lo = 0, hi = L.tops.length - 1;
    while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        if (L.tops[mid] <= y) lo = mid; else hi = mid - 1;
    }
    return lo;
}

/** Rendering is one page at a time: `doc.page()` drives the module, and a fast
 *  scroll must never find two pages half-rendered inside it. */
let renderTurn = Promise.resolve();
let gen = 0;                      // which document the queue belongs to

/** Forget everything about the pages of the document that was open. */
function resetPages() {
    gen++;
    pages.textContent = "";
    state.mounted.clear();
    state.mounting.clear();
    state.sizes.clear();
    state.size = null;
    state.layout = null;
    state.page = 0;
    state.z = 1;
}

/** Put page `k` in the DOM — at its slot, at once — and render it. */
function mount(k) {
    if (!state.doc || !state.layout || k < 0 || k >= state.pages) return Promise.resolve();
    if (state.mounted.has(k)) return state.mounting.get(k) || Promise.resolve();
    const el = document.createElement("div");
    el.className = "page";
    el.dataset.page = String(k + 1);
    state.mounted.set(k, el);
    place(k, el);
    pages.appendChild(el);
    const mine = gen;
    const run = renderTurn.then(() => renderPage(k, el, mine));
    renderTurn = run.catch(() => {});          // one failure must not stop the queue
    state.mounting.set(k, run);
    run.then(() => { if (state.mounting.get(k) === run) state.mounting.delete(k); },
             () => { if (state.mounting.get(k) === run) state.mounting.delete(k); });
    return run;
}

/** The page under the reader first, then the ones a flick of the wheel will
 *  reach; anything further off goes back to being reserved space. */
function mountAround() {
    const k = state.page;
    mount(k);
    mount(k + 1); mount(k + 2);
    mount(k - 1); mount(k - 2);
    for (const [key, el] of [...state.mounted]) {
        if (Math.abs(key - k) > KEEP) { el.remove(); state.mounted.delete(key); }
    }
}

async function renderPage(k, el, mine) {
    const doc = state.doc;
    if (mine !== gen || !doc) return;
    // Scrolled away while this page waited for the module: keep the slot, skip
    // the work, and drop the element so coming back mounts it afresh.
    if (Math.abs(k - state.page) > KEEP || state.mounted.get(k) !== el) {
        if (state.mounted.get(k) === el) { el.remove(); state.mounted.delete(k); }
        return;
    }
    const before = doc.bytes, beforeRequests = doc.requests;
    const t0 = performance.now();
    let svg;
    try {
        svg = await doc.page(k);
    } catch (e) { fail(e); return; }
    const t1 = performance.now();
    if (mine !== gen || state.doc !== doc || state.mounted.get(k) !== el) return;
    el.innerHTML = svg;
    const t2 = performance.now();
    // A page that is not the size we assumed moves everything below it: say so
    // and put the column back together, keeping the reader where they were.
    const size = sizeOf(el.querySelector("svg"));
    if (size) {
        const known = naturalSize(k);
        if (Math.abs(known[0] - size[0]) > 0.05 || Math.abs(known[1] - size[1]) > 0.05) {
            state.sizes.set(k, size);
            if (!state.size) state.size = size;
            if (typeof state.zoom === "number") { const keep = progressInPage(); relayout(); restoreProgress(keep); }
            else fit();
        }
    }
    el.classList.remove("enter");
    void el.offsetWidth;                        // restart the animation
    el.classList.add("enter");
    const t3 = performance.now();
    // Where the milliseconds went: the module's own time, the browser's
    // parse/style/paint after it, and the frame that actually landed.
    requestAnimationFrame(() => requestAnimationFrame(() => {
        if (mine !== gen) return;
        document.body.dataset.timing = JSON.stringify({
            page: k + 1,
            fetchModule: Math.round(t1 - t0),
            dom: Math.round(t2 - t1),
            layout: Math.round(t3 - t2),
            paint: Math.round(performance.now() - t3),
        });
    }));
    if (k === state.page) {
        say(`page ${k + 1}: ${fmt(doc.bytes - before)} in ${doc.requests - beforeRequests} request(s) · ` +
            `${fmt(doc.bytes)} of ${fmt(state.length)} read · ${Math.round(t3 - t0)} ms`);
    }
}

// --- scrolling -----------------------------------------------------------

let scrollFrame = 0, chromeTimer = 0;

stage.addEventListener("scroll", () => {
    if (scrollFrame) return;
    scrollFrame = requestAnimationFrame(() => { scrollFrame = 0; onScroll(); });
}, { passive: true });

function onScroll() {
    if (!state.doc || !state.layout) return;
    const k = pageAtScroll();
    if (k !== state.page) {
        state.page = k;
        updateChrome();
        preloadNeighbours();
        say(`page ${k + 1} of ${state.pages} · ${fmt(state.doc.bytes)} of ${fmt(state.length)} read`);
    }
    mountAround();
}

/** The dock, and the address bar — which follows the reader, but not on every
 *  frame of a fling. */
function updateChrome() {
    const i = state.page, n = state.pages;
    $("pageno").value = String(i + 1);
    $("prev").disabled = i === 0;
    $("next").disabled = i === n - 1;
    markToc();
    clearTimeout(chromeTimer);
    chromeTimer = setTimeout(() => {
        try {
            const query = new URLSearchParams(location.search);
            query.set("pdf", state.url);
            query.set("page", String(state.page + 1));
            history.replaceState(null, "", `?${query}${location.hash}`);
        } catch {}
    }, 180);
}

// --- size and zoom -------------------------------------------------------

/** The SVG carries its real physical size (`width="215.9mm"`); CSS px is what
 *  the screen wants, so convert. pt/mm/cm/in all land in CSS px exactly. */
function px(value) {
    const m = /^\s*(-?[\d.]+)\s*(px|pt|mm|cm|in|pc)?\s*$/.exec(value || "");
    if (!m) return 0;
    const per = { px: 1, pt: 96 / 72, pc: 16, mm: 96 / 25.4, cm: 96 / 2.54, in: 96 }[m[2] || "px"];
    return parseFloat(m[1]) * per;
}

/** A page's own size, in CSS px, from its SVG. */
function sizeOf(svg) {
    const w = px(svg && svg.getAttribute("width")), h = px(svg && svg.getAttribute("height"));
    return w > 0 && h > 0 ? [w, h] : null;
}

/** Work `state.zoom` out into a factor. Scaling by width keeps the text crisp
 *  and lets the column scroll, which a CSS transform would not. */
function fit() {
    const [w, h] = state.size || PROVISIONAL;
    const pad = window.matchMedia("(max-width: 720px)").matches ? 16 : 28;
    const availW = Math.max(120, stage.clientWidth - 2 * pad);
    const availH = Math.max(120, stage.clientHeight - 2 * pad - (document.body.classList.contains("ready") ? 40 : 0));
    const z = typeof state.zoom === "number" ? state.zoom
        : state.zoom === "width" ? availW / w
        : Math.min(availW / w, availH / h);
    setZoom(z);
}

/** Put a zoom in force: every slot moves, the reader stays where they were. */
function setZoom(z) {
    const keep = progressInPage();
    state.z = Math.min(Math.max(z, 0.25), 6);
    relayout();
    restoreProgress(keep);
    $("zoomlabel").textContent = `${Math.round(state.z * 100)}%`;
    $("zoomout").disabled = state.z <= 0.251;
    $("zoomin").disabled = state.z >= 5.99;
}

function zoomBy(factor) {
    state.zoom = Math.min(6, Math.max(0.25, state.z * factor));
    fit();
}
function zoomCycle() {
    if (state.zoom === "page") state.zoom = "width";
    else if (state.zoom === "width") state.zoom = 1;
    else state.zoom = "page";
    fit();
}

let resizeFrame = 0;
new ResizeObserver(() => {
    if (resizeFrame) return;
    resizeFrame = requestAnimationFrame(() => { resizeFrame = 0; if (typeof state.zoom !== "number") fit(); });
}).observe(stage);

// --- the chrome ---------------------------------------------------------

$("prev").onclick = () => show(state.page - 1);
$("next").onclick = () => show(state.page + 1);
$("zoomin").onclick = () => zoomBy(1.15);
$("zoomout").onclick = () => zoomBy(1 / 1.15);
$("zoomlabel").onclick = zoomCycle;
$("errorclose").onclick = clearError;

// --- the table of contents -----------------------------------------------
//
// The document's own outline, not a list of page numbers invented here: the
// same headings the file's `/Outlines` carries, with the nesting it gives
// them. Reading it costs one pass — the page tree and the destinations, a
// fraction of a page — and it is fetched *after* the first page is on screen,
// so opening a document is never slower for having a sidebar.
//
// Whether it is open is remembered per browser, not per document: a reader who
// has the contents out wants them out for the next file too.

const SIDE_KEY = "pdf-viewer-toc";
const side = $("side"), toc = $("toc");
let tocRows = [];      // [{ page, el }], in document order
let tocPage = -1;      // the page the highlight is on, so it moves only on a turn
let tocPick = null;    // the row the reader clicked, while they are still on its page
/** Pages the contents has already started fetching, so pointing along a long
 *  outline does not queue the same request twice. */
const tocWarm = new Set();
let tocWarmTimer = 0;
let sideOpen = true;
try {
    const saved = localStorage.getItem(SIDE_KEY);
    sideOpen = saved === null ? !matchMedia("(max-width: 720px)").matches : saved === "1";
} catch {}

function applySide(save = true) {
    side.hidden = !sideOpen;
    $("tocbtn").setAttribute("aria-expanded", String(sideOpen));
    if (save) try { localStorage.setItem(SIDE_KEY, sideOpen ? "1" : "0"); } catch {}
}

$("tocbtn").onclick = () => { sideOpen = !sideOpen; applySide(); };
$("sideclose").onclick = () => { sideOpen = false; applySide(); $("tocbtn").focus(); };
applySide(false);

function clearToc(note) {
    toc.textContent = "";
    tocRows = [];
    tocPage = -1;
    tocPick = null;
    tocWarm.clear();
    clearTimeout(tocWarmTimer);
    if (note) {
        const div = document.createElement("div");
        div.className = "toc-note";
        div.textContent = note;
        toc.appendChild(div);
    }
}

/** Start fetching the page a heading points at, before it is clicked.
 *
 *  This is what the sender's page table is good for here: it says exactly what
 *  a page reads, so one request can be in flight while the pointer is still on
 *  the row, and the click arrives to find the range already in hand. Without a
 *  table `prefetch` is a no-op — the ranges are only known by asking, which is
 *  the render itself — so the contents behaves exactly as it did before, and
 *  costs nothing. */
function warmToc(page) {
    clearTimeout(tocWarmTimer);
    const doc = state.doc;
    if (!doc || !doc.hasTable || !(page >= 0) || page >= state.pages) return;
    if (tocWarm.has(page)) return;
    tocWarm.add(page);
    doc.prefetch(page).then((got) => {
        if (got) console.log(`contents: page ${page + 1} already fetched (${fmt(got)})`);
    }).catch(() => tocWarm.delete(page));
}

/** The same, after the pointer has rested on a row: dragging down a long
 *  outline should not fetch every heading it passes. */
function warmSoon(page) {
    clearTimeout(tocWarmTimer);
    tocWarmTimer = setTimeout(() => warmToc(page), 90);
}

/** Draw the outline: one row per heading, indented by its depth, the page on
 *  the right. A row with no page (an external file, a script) is shown but
 *  not clickable — a chapter that opens somewhere else is still a chapter. */
function drawToc(entries) {
    clearToc(null);
    if (!entries.length) {
        clearToc("This document has no table of contents.");
        return;
    }
    for (const [depth, page, title] of entries) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "toc-row";
        row.style.paddingLeft = `${6 + Math.min(depth, 12) * 11}px`;
        row.title = title || "";
        const label = document.createElement("span");
        label.className = "toc-label";
        label.textContent = title || (page != null ? `page ${page + 1}` : "—");
        row.appendChild(label);
        if (page != null && page < state.pages) {
            const num = document.createElement("span");
            num.className = "toc-page";
            num.textContent = String(page + 1);
            row.appendChild(num);
            const entry = { page, el: row };
            row.onclick = () => { tocPick = entry; show(page); narrowClose(); };
            // What the page table buys the contents: the heading under the
            // pointer is fetched before it is clicked. A tap has no dwell, so
            // a finger starts it on touch-down.
            row.addEventListener("pointerenter", () => warmSoon(page));
            row.addEventListener("pointerleave", () => clearTimeout(tocWarmTimer));
            row.addEventListener("pointerdown", () => warmToc(page));
            row.addEventListener("focus", () => warmToc(page));
            tocRows.push(entry);
        } else {
            row.disabled = true;
        }
        toc.appendChild(row);
    }
    const rows = tocRows.length;
    console.log(`contents: ${entries.length} row(s), ${rows} with a page`);
    markToc(true);
}

function narrowClose() {
    if (sideOpen && matchMedia("(max-width: 720px)").matches) { sideOpen = false; applySide(); }
}

/** Mark the row for the section the reader is in: the last heading at or above
 *  their page, in document order. Not a binary search: an outline is in the
 *  order the document reads it, which is not always the order of its pages
 *  (front matter, appendices), and a linear pass over a few hundred rows on a
 *  page turn costs nothing. */
function markToc(force = false) {
    if (!tocRows.length || (!force && tocPage === state.page)) return;
    tocPage = state.page;
    let best = null;
    // The row they just clicked wins while they are on its page: several
    // headings often live on one page, and marking the last of them would
    // answer a click on the first with a different row.
    if (tocPick && tocPick.page === tocPage && tocPick.el.isConnected) {
        best = tocPick;
    } else {
        for (const row of tocRows) if (row.page <= tocPage) best = row;
    }
    for (const row of tocRows) row.el.setAttribute("aria-current", row === best ? "true" : "false");
    if (best && sideOpen) best.el.scrollIntoView({ block: "nearest" });
}

/** Read and draw the outline of the document that is open. Queued with the
 *  page renders: the module renders one thing at a time. */
function refreshToc() {
    const doc = state.doc;
    if (!doc) { clearToc("no document"); return Promise.resolve(); }
    clearToc("reading the contents …");
    const mine = gen;
    const run = renderTurn.then(async () => {
        if (mine !== gen || state.doc !== doc) return;
        let entries = [];
        try {
            entries = await doc.outline();
        } catch (e) {
            console.log(`no contents: ${e.message || e}`);
        }
        if (mine !== gen || state.doc !== doc) return;
        drawToc(Array.isArray(entries) ? entries : []);
    });
    renderTurn = run.catch(() => {});
    return run;
}

$("openform").addEventListener("submit", (e) => {
    e.preventDefault();
    const url = $("url").value.trim();
    if (!url) return;
    $("openform").hidden = true;
    open(url);
});

// While a document is open the address field would only repeat the title, so
// it lives behind this button and comes back on demand.
$("openbtn").onclick = () => {
    const form = $("openform");
    form.hidden = !form.hidden;
    if (!form.hidden) { $("url").focus(); $("url").select(); }
};
$("url").addEventListener("keydown", (e) => {
    if (e.key === "Escape") { $("openform").hidden = true; $("openbtn").focus(); }
});

// Type 20 and press Enter: the page is fetched on its own, no need to walk
// there from page 1.
$("pageno").addEventListener("change", () => {
    const n = Math.round(Number($("pageno").value));
    if (!Number.isFinite(n)) { $("pageno").value = String(state.page + 1); return; }
    const target = Math.min(Math.max(n, 1), state.pages || 1) - 1;
    if (target !== state.page) show(target); else $("pageno").value = String(state.page + 1);
});
$("pageno").addEventListener("keydown", (e) => { if (e.key === "Enter") $("pageno").blur(); });
$("pageno").addEventListener("focus", () => $("pageno").select());

/** The stage is the scroller and the body is not, so the keys a reader uses to
 *  scroll have to be sent there by hand. A screenful — unless a page's edge is
 *  nearer than that, in which case the reader asked for the next page and
 *  should get its top, not a few pixels into it. */
function scrollBy(dy) {
    stage.scrollBy({ top: dy, behavior: "smooth" });
}

function scrollScreen(dir) {
    const L = state.layout;
    if (!L) return;
    const screen = Math.max(80, stage.clientHeight - 64);
    const edge = L.tops[state.page + dir];
    if (edge !== undefined) {
        const to = pages.offsetTop + edge;
        if (Math.abs(to - stage.scrollTop) <= screen) {
            stage.scrollTo({ top: to, behavior: "smooth" });
            return;
        }
    }
    stage.scrollBy({ top: dir * screen, behavior: "smooth" });
}

addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea")) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key) {
        case "ArrowLeft": show(state.page - 1); break;
        case "ArrowRight": show(state.page + 1); break;
        case "ArrowDown": scrollBy(64); break;
        case "ArrowUp": scrollBy(-64); break;
        case " ": case "PageDown": scrollScreen(1); break;
        case "PageUp": scrollScreen(-1); break;
        case "Home": show(0); break;
        case "End": show(state.pages - 1); break;
        case "+": case "=": zoomBy(1.15); break;
        case "-": case "_": zoomBy(1 / 1.15); break;
        case "0": state.zoom = "page"; fit(); break;
        case "f": zoomCycle(); break;
        case "t": sideOpen = !sideOpen; applySide(); break;
        case "Escape": clearError(); $("openform").hidden = true; break;
        default: return;
    }
    e.preventDefault();
});

// --- a file from this device --------------------------------------------

const card = $("card"), file = $("file");
card.addEventListener("click", () => file.click());
card.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); } });
file.addEventListener("change", () => { if (file.files[0]) openLocal(file.files[0]); });

// A local file cannot be range-fetched without a server, so a drop reads it
// whole and hands it over in one piece: same module, one request's worth.
stage.addEventListener("dragover", (e) => { e.preventDefault(); card.classList.add("hot"); });
stage.addEventListener("dragleave", () => card.classList.remove("hot"));
stage.addEventListener("drop", async (e) => {
    e.preventDefault();
    card.classList.remove("hot");
    const dropped = e.dataTransfer.files[0];
    if (dropped) await openLocal(dropped);
});

async function openLocal(f) {
    busy(true);
    try {
        const bytes = new Uint8Array(await f.arrayBuffer());
        clearError();
        if (state.doc) state.doc.free();
        resetPages();
        const doc = new Doc(new HttpSource("", bytes.length));
        state.length = bytes.length;
        await doc.fonts(FONTS);
        // No server: every byte is here already.
        const mod = await load(WASM);
        const ptr = mod.pdf_buf_alloc(bytes.length);
        new Uint8Array(mod.memory.buffer, ptr, bytes.length).set(bytes);
        mod.pdf_supply(doc, 0, ptr, bytes.length);
        mod.pdf_buf_free(ptr, bytes.length);
        state.pages = await doc.open();
        state.doc = doc;
        state.url = f.name;
        state.page = 0;
        $("title").textContent = f.name;
        document.title = `${f.name} — PDF`;
        $("pagecount").textContent = String(state.pages);
        $("pageno").max = String(state.pages);
        $("welcome").hidden = true;
        document.body.classList.add("ready");
        fit();
        $("openform").hidden = true;
        $("openbtn").hidden = false;
        say(`${state.pages} page(s), ${fmt(bytes.length)}`);
        await show(0);
        refreshToc();
    } catch (e) { fail(e); } finally { busy(false); }
}

// --- theme ---------------------------------------------------------------

const media = matchMedia("(prefers-color-scheme: dark)");
let theme = "auto";
try { theme = localStorage.getItem("pdf-viewer-theme") || "auto"; } catch {}

function applyTheme() {
    const dark = theme === "dark" || (theme === "auto" && media.matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    $("theme").title = `theme: ${theme}`;
    $("theme").setAttribute("aria-label", `theme: ${theme}`);
    const icon = $("theme").firstElementChild;
    icon.innerHTML = theme === "auto"
        ? `<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>`
        : dark
            ? `<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>`
            : `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>`;
}

$("theme").onclick = () => {
    theme = theme === "auto" ? "light" : theme === "light" ? "dark" : "auto";
    try { localStorage.setItem("pdf-viewer-theme", theme); } catch {}
    applyTheme();
    if (typeof state.zoom !== "number") fit();
};
media.addEventListener("change", () => { if (theme === "auto") applyTheme(); });
applyTheme();

// --- start ---------------------------------------------------------------

const params = new URLSearchParams(location.search);
const pdf = params.get("pdf");
if (pdf) {
    $("url").value = pdf;
    await open(pdf, Number(params.get("page") || 1) || 1);
} else {
    say("no document");
}

// `Doc` hides the module; a local file needs `pdf_supply` directly, hence the
// re-export above. Nothing else reaches into the module.
export { };
</script>
</body>
</html>
